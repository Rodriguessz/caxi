name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: caxi
          POSTGRES_PASSWORD: caxi_ci   # credencial descartável do container efêmero
          POSTGRES_DB: caxi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caxi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://caxi:caxi_ci@localhost:5432/caxi_test
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Varredura de segredos (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact -v
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations do zero em PostgreSQL/PostGIS limpo
        run: npm run migration:run --workspace apps/api
      - name: Migration é reversível
        run: npm run migration:revert --workspace apps/api && npm run migration:run --workspace apps/api
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build

  ambiente-reproduzivel:
    # Prova que o ambiente sobe do zero numa máquina limpa, com um único comando.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc }
      - run: docker compose up --build -d
      - run: npm run smoke
      - if: failure()
        run: docker compose logs

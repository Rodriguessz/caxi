# Ambiente local reproduzível do Caxi.
# Uso: `docker compose up --build -d` e abrir http://localhost:8080
# Isto NÃO é evidência de deploy nem de CI/CD — é o ambiente de desenvolvimento.
name: caxi

x-api-image: &api-image
  build: { context: ., dockerfile: apps/api/Dockerfile }
  image: caxi-api:local
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-caxi}:${POSTGRES_PASSWORD:-caxi_dev}@db:5432/${POSTGRES_DB:-caxi}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caxi_dev}   # credencial local descartável
      POSTGRES_DB: ${POSTGRES_DB:-caxi}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Tarefa única, como a task isolada de migrations do pipeline na AWS.
  migrate:
    <<: *api-image
    command: ["sh", "-c", "npm run migration:run:prod && npm run seed:prod"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api-image
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: caxi-web:local
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:

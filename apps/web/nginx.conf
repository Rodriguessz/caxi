server {
  listen 80;
  root /usr/share/nginx/html;

  # Mesmo roteamento da AWS: /api/* vai para a API, o resto é a SPA.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
